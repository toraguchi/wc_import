name: Work-Hours-Automation
on:
  schedule:
    # -------------------------------------------------------------------------
    # 日本時間（JST） 09:00 〜 17:59 の間、10分おきに実行
    # UTC（世界標準時）では 00:00 〜 08:59 となります
    # -------------------------------------------------------------------------
    - cron: '*/10 0-8 * * *'

  # 動作確認用の手動実行ボタン
  workflow_dispatch:

jobs:
  automation-job:
    runs-on: ubuntu-latest
    # 有償枠での無駄な消費を防ぐため、15分で強制終了
    timeout-minutes: 15

    steps:
      - name: コード取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 必要ライブラリ インストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright gspread google-auth

      - name: Playwright ブラウザのキャッシュ
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Playwright インストール（キャッシュがない場合のみ）
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Playwright 依存関係のみインストール（キャッシュがある場合）
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: 自動化スクリプトの実行
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          WC_ID_1: ${{ secrets.WC_ID_1 }}
          WC_ID_2: ${{ secrets.WC_ID_2 }}
          WC_PASS_1: ${{ secrets.WC_PASS_1 }}
          WC_PASS_2: ${{ secrets.WC_PASS_2 }}
        run: python scrape.py

      - name: 失敗時のみスクショを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: "*.png"
